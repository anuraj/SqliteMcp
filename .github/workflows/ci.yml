name: .NET
permissions:
  contents: read
  copilot-requests: write
  issues: write
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      already_published: ${{ steps.version_check.outputs.already_published }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SqliteMcp.slnx

      - name: Build
        run: dotnet build SqliteMcp.slnx --no-restore

      - name: Test with code coverage
        run: |
          dotnet test Tests/SqliteMcp.Tests/SqliteMcp.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/**/coverage.cobertura.xml
          retention-days: 7

      - name: Read package version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<PackageVersion>)[^<]+' Src/SqliteMcp.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version is already published on NuGet
        id: version_check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/sqlitemcp/${VERSION}/sqlitemcp.${VERSION}.nupkg")
          if [ "$STATUS" = "200" ]; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION is already published — skipping deploy."
          elif [ "$STATUS" = "404" ]; then
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is new — will deploy."
          else
            echo "Failed to determine whether version $VERSION is published (HTTP $STATUS)." >&2
            exit 1
          fi
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run Copilot review
        run: |
          set -euo pipefail
          copilot --silent --yolo -p "Review the changes in this commit for bugs, security issues, and logic errors. Respond with ONLY a JSON array and no other text or markdown fences. Each element must be an object with exactly these keys: title, filename, lineNumber, issue, impact, recommendation, severity. 'title' must read like a GitHub issue title: a short imperative sentence under 70 characters that names the concrete problem (e.g. 'Validate table name before interpolating into SQL'), never a file path or a severity label. 'issue' explains the problem, 'impact' explains the consequence, 'recommendation' explains how to fix it. 'severity' is one of critical, high, medium, low. Return an empty array if there are no findings." > /tmp/copilot_review.txt
          [[ -s /tmp/copilot_review.txt ]] || { echo "Copilot returned empty output" >&2; exit 1; }
          # Drop any markdown code fences the model may still emit
          sed 's/^[[:space:]]*```\(json\)\?[[:space:]]*$//' /tmp/copilot_review.txt > /tmp/copilot_review.json
          jq -e 'type == "array"' /tmp/copilot_review.json > /dev/null || {
            echo "Copilot output was not a JSON array:" >&2
            cat /tmp/copilot_review.txt >&2
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create an issue per Copilot review finding
        run: |
          set -euo pipefail
          COUNT=$(jq 'length' /tmp/copilot_review.json)
          echo "Copilot reported $COUNT finding(s)."
          PERMALINK_BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          for i in $(seq 0 $((COUNT - 1))); do
            TITLE=$(jq -r --argjson i "$i" '.[$i].title // .[$i].issue // "Copilot review finding" | split("\n")[0][0:70]' /tmp/copilot_review.json)
            BODY=$(jq -r --argjson i "$i" --arg sha "$GITHUB_SHA" --arg base "$PERMALINK_BASE" '
              .[$i] |
              (.filename // "unknown") as $file |
              (.lineNumber // "?" | tostring) as $line |
              "### Summary\n\n\(.issue // "Not provided")\n\n" +
              "### Location\n\n" +
              (if $file == "unknown" then "Not provided\n\n"
               else "[\($file):\($line)](\($base)/\($file)#L\($line))\n\n" end) +
              "### Impact\n\n\(.impact // "Not provided")\n\n" +
              "### Suggested fix\n\n\(.recommendation // "Not provided")\n\n" +
              "### Severity\n\n\(.severity // "Unspecified")\n\n---\n\n" +
              "_Automatically reported by the Copilot review step for commit \($sha)._"
            ' /tmp/copilot_review.json)
            gh issue create --title "$TITLE" --body "$BODY"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.ci.outputs.already_published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Src/SqliteMcp.csproj

      - name: Pack
        run: dotnet pack Src/SqliteMcp.csproj -c Release --no-restore

      - name: Deploy to NuGet
        run: dotnet nuget push Src/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_APIKEY }} --source https://api.nuget.org/v3/index.json